# ============================================================
# EXAMPLE: Franka Panda 7-DOF Arm + RMPFlow Controller
# ============================================================
#
# Robot type:  7-DOF robotic arm with parallel-jaw gripper
# Controller:  rmpflow — Riemannian Motion Policy flow controller
# Teleop:      Keyboard
# Use case:    Collision-aware motion, smooth reactive control
#
# RMPFlow (Riemannian Motion Policies) combines multiple motion
# policies (goal reaching, collision avoidance, joint limits)
# into a single smooth control output. It is particularly good for:
#   - Environments with obstacles
#   - Smooth, natural-looking robot motion
#   - Reactive obstacle avoidance during teleoperation
#
# Key settings for rmpflow:
#   body_offset:       Offset from body frame to EEF tip
#   use_relative_mode: true = relative SE(3) commands,
#                      false = absolute pose targets
#
# Run:
#   python scripts/create_task.py franka_rmpflow.yaml --dry-run
#   python scripts/create_task.py franka_rmpflow.yaml
#
# ============================================================


# ─── TASK IDENTITY ───────────────────────────────────────────
task_name: franka_rmpflow
task_id: IL-Franka-RMPFlow-v0


# ─── ROBOT ───────────────────────────────────────────────────
robot:
  import_path: isaaclab_assets.robots.franka
  config_name: FRANKA_PANDA_HIGH_PD_CFG
  prim_path: "/World/envs/env_.*/Robot"
  init_pos: [0.0, 0.5, 0.4]
  init_rot: [0.7071, 0.0, 0.0, -0.7071]


# ─── SCENE USD ───────────────────────────────────────────────
scene:
  usd_file: scene.usd
  scale: [1.0, 1.0, 1.0]
  init_pos: [0.0, 0.0, 0.0]
  init_rot: [1.0, 0.0, 0.0, 0.0]


# ─── SCENE OBJECTS ───────────────────────────────────────────
scene_objects: []


# ─── IK CONTROLLER ───────────────────────────────────────────
# RMPFlow settings:
#   - Automatically handles joint limits and self-collision
#   - body_offset shifts the target to the fingertip
#   - use_relative_mode: false for absolute pose targets
ik_controller:
  controller_type: rmpflow
  base_link_name: panda_link0
  controlled_joint_names:
    - "panda_joint1"
    - "panda_joint2"
    - "panda_joint3"
    - "panda_joint4"
    - "panda_joint5"
    - "panda_joint6"
    - "panda_joint7"
  hand_joint_names:
    - "panda_finger_joint1"
    - "panda_finger_joint2"
  num_hand_joints: 2
  body_offset: [0.0, 0.0, 0.107]
  use_relative_mode: false


# ─── END-EFFECTORS ───────────────────────────────────────────
eef:
  names: ["gripper"]
  target_links:
    gripper: panda_hand
  frame_names:
    gripper: panda_hand


# ─── OBSERVATIONS ────────────────────────────────────────────
observations:
  eef_link_names:
    gripper: panda_hand


# ─── TELEOP ──────────────────────────────────────────────────
teleop:
  device: keyboard


# ─── SIMULATION ──────────────────────────────────────────────
sim:
  decimation: 6
  episode_length_s: 20.0
  dt: 0.008333
  render_interval: 2
  env_spacing: 2.5
