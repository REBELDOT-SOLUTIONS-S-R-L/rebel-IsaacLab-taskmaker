# ============================================================
# EXAMPLE: Franka Panda 7-DOF Arm + Differential IK (DLS)
# ============================================================
#
# Robot type:  7-DOF robotic arm with parallel-jaw gripper
# Controller:  differential_ik — resolved-rate IK using Jacobian
# Teleop:      Keyboard (Se3Keyboard)
# Use case:    Single-arm pick-and-place, precision manipulation
#
# Differential IK is the most common controller for single-arm
# robots. It computes joint velocities from a desired end-effector
# velocity using the Jacobian pseudoinverse.
#
# Key settings for differential_ik:
#   ik_method:         "dls" (damped least squares — most stable),
#                      "svd" (singular value decomposition),
#                      "pinv" (pseudoinverse — simplest)
#   command_type:      "pose" (6-DOF position+orientation) or
#                      "position" (3-DOF position only)
#   use_relative_mode: true = relative commands, false = absolute
#   body_offset:       Offset from the body frame to the actual EEF tip
#
# Run:
#   python scripts/create_task.py franka_panda.yaml --dry-run
#   python scripts/create_task.py franka_panda.yaml
#
# ============================================================


# ─── TASK IDENTITY ───────────────────────────────────────────
task_name: tm7_franka
task_id: IL-TM7-Franka-v0


# ─── ROBOT ───────────────────────────────────────────────────
# Franka Panda: 7 arm joints + 2 finger joints
# FRANKA_PANDA_HIGH_PD_CFG uses high PD gains for stable IK control.
robot:
  import_path: isaaclab_assets.robots.franka
  config_name: FRANKA_PANDA_HIGH_PD_CFG
  prim_path: "/World/envs/env_.*/Robot"
  init_pos: [0.0, 0.5, 0.4]
  init_rot: [0.7071, 0.0, 0.0, -0.7071]


# ─── SCENE USD ───────────────────────────────────────────────
scene:
  usd_file: scene.usd
  scale: [1.0, 1.0, 1.0]
  init_pos: [0.0, 0.0, 0.0]
  init_rot: [1.0, 0.0, 0.0, 0.0]


# ─── SCENE OBJECTS ───────────────────────────────────────────
scene_objects:
  - name: tm7_bowl
    type: RigidObjectCfg
    prim_path: "{ENV_REGEX_NS}/Scene/tm7_bowl"
    usd_file: tm7_bowl_collisions.usd
    scale: [0.35, 0.35, 0.35]
    init_pos: [0.0, 0.5, 0.185]
    init_rot: [0.70711, 0.0, 0.0, 0.70711]
  - name: tm7_lid
    type: RigidObjectCfg
    prim_path: "{ENV_REGEX_NS}/Scene/tm7_lid"
    usd_file: tm7_lid_collisions.usd
    scale: [0.35, 0.35, 0.35]
    init_pos: [0.0, 0.5, 0.2]
    init_rot: [0.5, 0.5, -0.5, 0.5]


# ─── IK CONTROLLER ───────────────────────────────────────────
# Differential IK settings:
#   ik_method: "dls"    — Damped Least Squares (recommended, most stable)
#              "svd"    — Truncated SVD (good near singularities)
#              "pinv"   — Moore-Penrose pseudoinverse (simplest)
#   command_type: "pose"     — 6-DOF SE(3) commands [position + orientation]
#                 "position" — 3-DOF commands [position only]
#   body_offset: Offset from panda_hand frame to the fingertip.
#                [0, 0, 0.107] accounts for the distance between the
#                wrist (panda_hand) and the grasp point between the fingers.
ik_controller:
  controller_type: differential_ik
  base_link_name: panda_link0
  controlled_joint_names:
    - "panda_joint1"
    - "panda_joint2"
    - "panda_joint3"
    - "panda_joint4"
    - "panda_joint5"
    - "panda_joint6"
    - "panda_joint7"
  hand_joint_names:
    - "panda_finger_joint1"
    - "panda_finger_joint2"
  num_hand_joints: 2
  ik_method: dls
  command_type: pose
  use_relative_mode: false
  body_offset: [0.0, 0.0, 0.107]


# ─── END-EFFECTORS ───────────────────────────────────────────
# Single-arm robots use one EEF entry.
# "gripper" is a logical name — you can call it anything.
# target_links maps the logical name to the actual robot link.
eef:
  names: ["gripper"]
  target_links:
    gripper: panda_hand
  frame_names:
    gripper: panda_hand


# ─── OBSERVATIONS ────────────────────────────────────────────
observations:
  eef_link_names:
    gripper: panda_hand


# ─── TELEOP ──────────────────────────────────────────────────
# "keyboard" is the default for non-pink_ik controllers.
# Other options: "spacemouse", "gamepad"
teleop:
  device: keyboard


# ─── SIMULATION ──────────────────────────────────────────────
sim:
  decimation: 6
  episode_length_s: 20.0
  dt: 0.008333
  render_interval: 2
  env_spacing: 2.5
