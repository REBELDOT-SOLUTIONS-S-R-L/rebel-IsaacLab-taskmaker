# ============================================================
# EXAMPLE: Unitree G1 Humanoid + Pink IK Controller
# ============================================================
#
# Robot type:  Humanoid (dual-arm with dexterous hands)
# Controller:  pink_ik — task-space IK using the Pink library
# Teleop:      XR hand tracking (OpenXR)
# Use case:    Bimanual manipulation with finger-level control
#
# Pink IK is the recommended controller for humanoid robots
# with XR hand tracking. It solves full-body IK including
# finger joints, and supports null-space posture control to
# keep the torso stable while the arms move.
#
# Run:
#   python scripts/create_task.py example.yaml --dry-run   # preview
#   python scripts/create_task.py example.yaml              # generate
#
# ============================================================


# ─── TASK IDENTITY ───────────────────────────────────────────
# task_name:  Snake_case name used for the folder and Python class prefix.
#             "tm7_g1" generates class TM7G1TaskCfg in tasks/manager_based/tm7_g1/
# task_id:    Gymnasium environment ID used to register and launch the task.
task_name: lego_g1
task_id: IL-LEGO-G1-v0


# ─── ROBOT ───────────────────────────────────────────────────
# name:         Scene attribute name (becomes `cfg.scene.<name>` and
#               `env.scene["<name>"]`). Defaults to "robot" if omitted.
# import_path:  Python module containing the ArticulationCfg.
# config_name:  Name of the ArticulationCfg variable in that module.
# prim_path:    USD scene path pattern (env_.* is replaced per environment).
# init_pos:     Initial position [x, y, z] in meters.
# init_rot:     Initial rotation [w, x, y, z] as a quaternion.
robot:
  name: unitree_g1
  import_path: isaaclab_assets.robots.unitree
  config_name: G1_INSPIRE_FTP_CFG
  prim_path: "/World/envs/env_.*/Robot"
  init_pos: [-1.05, 0, 0.8]
  init_rot: [1.0, 0.0, 0.0, 0.0]


# ─── SCENE USD ───────────────────────────────────────────────
# The scene USD is loaded from: assets/scenes/<usd_file>
# Place your scene USD file there after generating the task.
scene:
  usd_file: lego.usd
  scale: [1.0, 1.0, 1.0]
  init_pos: [0.0, 0.0, 0.0]
  init_rot: [1.0, 0.0, 0.0, 0.0]


# ─── SCENE OBJECTS (optional) ────────────────────────────────
# Rigid bodies that the robot interacts with. Each object needs:
#   name:                       Unique identifier (becomes a Python attribute)
#   type:                       "RigidObjectCfg" for physics-tracked / resettable objects,
#                               "AssetBaseCfg" for static decoration.
#   prim_path:                  USD path in the scene ({ENV_REGEX_NS} = per-env prefix)
#   usd_file:                   Filename in assets/objects/
#   scale:                      Scale factor [x, y, z]
#   init_pos:                   Initial position [x, y, z] in meters
#   init_rot:                   Initial rotation [w, x, y, z] quaternion
#   use_default_sdf_collision:  When true, the spawner overrides the mesh collision
#                               approximation with SDF (good for arbitrary visual meshes
#                               used as dynamic bodies). When false, whatever collision
#                               approximation is baked into the USD is preserved.
#                               Defaults to true.
#   physics_material:           Optional. Overrides PhysX friction / restitution for this
#                               object via a per-prim RigidBodyMaterialCfg. Fields:
#                                   static_friction   (default 0.5)
#                                   dynamic_friction  (default 0.5)
#                                   restitution       (default 0.0)
#                               Omit to inherit the simulation's default material.
scene_objects:
  - name: blue_brick
    type: RigidObjectCfg
    prim_path: "{ENV_REGEX_NS}/blue_brick"
    usd_file: lego/brick_2x2.usd
    scale: [0.0005, 0.0005, 0.0005]
    init_pos: [-0.5, 0.15, 0.83]
    init_rot: [1.0, 0.0, 0.0, 0.0]
    use_default_sdf_collision: true
    physics_material:
      static_friction: 1.2
      dynamic_friction: 1.0
      restitution: 0.0


# ─── IK CONTROLLER ───────────────────────────────────────────
# controller_type: "pink_ik"
#   Pink IK is a task-space inverse kinematics solver from the Pink library.
#   It works with URDF models and supports multiple simultaneous tasks
#   (e.g., left hand + right hand + posture).
#
# REQUIRED for pink_ik:
#   base_link_name:         Root link of the kinematic chain
#   controlled_joint_names: All joints the IK solver can move (arms)
#   hand_joint_names:       Finger joints (mapped from XR hand tracking)
#   num_hand_joints:        Total number of finger joints
#
# OPTIONAL for pink_ik:
#   null_space_joints:      Joints for posture control (e.g., waist).
#                           These are used to keep the torso stable
#                           while the arms move freely.
ik_controller:
  controller_type: pink_ik
  base_link_name: pelvis
  controlled_joint_names:
    - ".*_shoulder_pitch_joint"
    - ".*_shoulder_roll_joint"
    - ".*_shoulder_yaw_joint"
    - ".*_elbow_joint"
    - ".*_wrist_yaw_joint"
    - ".*_wrist_roll_joint"
    - ".*_wrist_pitch_joint"
  hand_joint_names:
    - "L_index_proximal_joint"
    - "L_middle_proximal_joint"
    - "L_pinky_proximal_joint"
    - "L_ring_proximal_joint"
    - "L_thumb_proximal_yaw_joint"
    - "R_index_proximal_joint"
    - "R_middle_proximal_joint"
    - "R_pinky_proximal_joint"
    - "R_ring_proximal_joint"
    - "R_thumb_proximal_yaw_joint"
    - "L_index_intermediate_joint"
    - "L_middle_intermediate_joint"
    - "L_pinky_intermediate_joint"
    - "L_ring_intermediate_joint"
    - "L_thumb_proximal_pitch_joint"
    - "R_index_intermediate_joint"
    - "R_middle_intermediate_joint"
    - "R_pinky_intermediate_joint"
    - "R_ring_intermediate_joint"
    - "R_thumb_proximal_pitch_joint"
    - "L_thumb_intermediate_joint"
    - "R_thumb_intermediate_joint"
    - "L_thumb_distal_joint"
    - "R_thumb_distal_joint"
  num_hand_joints: 24
  null_space_joints:
    - "waist_yaw_joint"
    - "waist_pitch_joint"
    - "waist_roll_joint"


# ─── END-EFFECTORS ───────────────────────────────────────────
# For dual-arm humanoids with pink_ik:
#   names:                Logical EEF identifiers (used in observations)
#   target_links:         Map of logical name → robot link name (for IK targets)
#   frame_names:          Map of logical name → URDF frame name (Pink IK requires
#                         the full URDF-prefixed link name, not the USD link name)
#   hand_joint_prefixes:  Optional. Per-EEF prefix of `hand_joint_names` entries
#                         that belong to that arm. Required for multi-EEF pink_ik
#                         tasks with hand joints, so the generator can build
#                         per-arm gripper index lists for BaseILEnv. Inspire
#                         hands prefix every joint with "L_" / "R_".
eef:
  names: ["left", "right"]
  target_links:
    left_wrist: left_wrist_yaw_link
    right_wrist: right_wrist_yaw_link
  frame_names:
    left: g1_29dof_rev_1_0_left_wrist_yaw_link
    right: g1_29dof_rev_1_0_right_wrist_yaw_link
  hand_joint_prefixes:
    left: "L_"
    right: "R_"


# ─── OBSERVATIONS ────────────────────────────────────────────
# eef_link_names: Links whose poses are included in observations.
# Must match target_links values (the robot link names, not URDF frames).
observations:
  eef_link_names:
    left: left_wrist_yaw_link
    right: right_wrist_yaw_link


# ─── CAMERAS (optional) ──────────────────────────────────────
# Each entry becomes a `CameraCfg` attribute on the scene cfg, plus a call
# inside an `attach_cameras(scene_cfg)` helper so the launcher can re-attach
# them after IsaacLab's XR pipeline strips cameras via
# `remove_camera_configs`.
#
#   name:                 Python attribute on the scene cfg (e.g. `scene_cfg.head_camera`).
#   prim_path:            USD path where the camera is mounted ({ENV_REGEX_NS} = per-env).
#   height / width:       Image resolution in pixels.
#   data_types:           List of channels the camera should produce ("rgb", "distance_to_image_plane", ...).
#   focal_length:         Pinhole focal length in mm.
#   focus_distance:       Plane-of-focus distance in cm.
#   horizontal_aperture:  Sensor width in mm.
#   clipping_range:       Near / far clip in meters.
#   offset_pos:           Local-frame offset from the parent prim, meters.
#   offset_rot:           Local-frame rotation as a quaternion [w, x, y, z].
#   convention:           One of "opengl", "ros", "world".
cameras:
  - name: head_camera
    prim_path: "{ENV_REGEX_NS}/Robot/torso_link/d435_link/head_camera"
    height: 480
    width: 640
    data_types: ["rgb"]
    focal_length: 12.0
    focus_distance: 400.0
    horizontal_aperture: 20.955
    clipping_range: [0.05, 10.0]
    offset_pos: [0.0, 0.0, 0.0]
    offset_rot: [0.5, 0.5, -0.5, -0.5]
    convention: opengl
  - name: right_wrist_camera
    prim_path: "{ENV_REGEX_NS}/Robot/right_wrist_yaw_link/right_wrist_camera"
    height: 480
    width: 640
    data_types: ["rgb"]
    focal_length: 10.0
    focus_distance: 400.0
    horizontal_aperture: 20.955
    clipping_range: [0.05, 10.0]
    offset_pos: [0.01, 0.05, 0.12]
    offset_rot: [0.65326, 0.27061, -0.27059, -0.6533]
    convention: opengl
  - name: left_wrist_camera
    prim_path: "{ENV_REGEX_NS}/Robot/left_wrist_yaw_link/left_wrist_camera"
    height: 480
    width: 640
    data_types: ["rgb"]
    focal_length: 10.0
    focus_distance: 400.0
    horizontal_aperture: 20.955
    clipping_range: [0.05, 10.0]
    offset_pos: [0.01, -0.05, 0.12]
    offset_rot: [0.65328, 0.2706, -0.2706, -0.65328]
    convention: opengl


# ─── TELEOP ──────────────────────────────────────────────────
# device: "handtracking" — uses OpenXR hand tracking for bimanual teleop.
#         Other options: "manusvive", "keyboard", "spacemouse", "gamepad"
#
# For pink_ik + hand tracking, you must specify:
#   retargeter_import: Python import path to the retargeter module
#   retargeter_class:  Name of the retargeter config class
teleop:
  device: handtracking
  retargeter_import: isaaclab.devices.openxr.retargeters.humanoid.unitree.inspire.g1_upper_body_retargeter
  retargeter_class: UnitreeG1RetargeterCfg
  # XR anchor placement (pink_ik only). The anchor positions the operator's
  # tracking-space origin in world coordinates so their hands land near the
  # robot's wrists. Default is identity, which only works for robots at the
  # origin — for G1 (robot at -1.05, 0, 0.8) we offset the anchor so the
  # tracking space sits below the robot's pelvis.
  xr_anchor_pos: [-1.05, 0.0, -0.3]
  xr_anchor_rot: [1.0, 0.0, 0.0, 0.0]


# ─── SIMULATION ──────────────────────────────────────────────
# decimation:       Number of sim steps per policy step (higher = smoother but slower)
# episode_length_s: Max episode duration in seconds
# dt:               Physics timestep (1/120 ≈ 0.008333)
# render_interval:  Render every N sim steps
# env_spacing:      Distance between parallel environments in meters
sim:
  decimation: 6
  episode_length_s: 20.0
  dt: 0.008333
  render_interval: 2
  env_spacing: 2.5


# ─── SUBTASK TERM PREDICATES (optional) ──────────────────────
# Declarative binding from `subtask_term_signal` name to the MDP function +
# params that compute it. Letting multiple signals share one function keeps
# the generated `mdp/observations.py` DRY — a single `grasp_brick_done`
# backs both `grasp_brick_left` and `grasp_brick_right` ObsTerms below.
#
# Each entry:
#   func:   MDP function name. Defaults to the signal name if omitted, in
#           which case the generator emits a one-stub-per-signal layout.
#   params: kwargs passed to the function. The signal name is added
#           automatically. Parameter types are inferred from the value
#           (str / int / float / tuple[float, ...]) and used to type the
#           generated stub's signature; refine the types after generation
#           if the inference picks something less specific than you want.
subtask_terms:
  grasp_brick_left:
    func: grasp_brick_done
    params:
      eef_link: left_wrist_yaw_link
      object_name: red_brick
      dist_threshold: 0.25
      gripper_joint_pattern: "L_.*_proximal_joint"
      gripper_closed_threshold: 1.3
  move_brick_left:
    func: move_brick_done
    params:
      eef_link: left_wrist_yaw_link
      object_name: red_brick
      target_pos: [-0.4, 0.05, 0.83]
      eef_dist_threshold: 0.25
      target_dist_threshold: 0.34
      gripper_joint_pattern: "L_.*_proximal_joint"
      gripper_closed_threshold: 1.3
  release_brick_left:
    func: release_brick_done
    params:
      object_name: red_brick
      target_pos: [-0.4, 0.05, 0.83]
      target_dist_threshold: 0.34
      gripper_joint_pattern: "L_.*_proximal_joint"
      gripper_open_threshold: 0.15
  grasp_brick_right:
    func: grasp_brick_done
    params:
      eef_link: right_wrist_yaw_link
      object_name: blue_brick
      dist_threshold: 0.25
      gripper_joint_pattern: "R_.*_proximal_joint"
      gripper_closed_threshold: 1.3
  move_brick_right:
    func: move_brick_done
    params:
      eef_link: right_wrist_yaw_link
      object_name: blue_brick
      target_pos: [-0.4, -0.05, 0.83]
      eef_dist_threshold: 0.25
      target_dist_threshold: 0.34
      gripper_joint_pattern: "R_.*_proximal_joint"
      gripper_closed_threshold: 1.3
  release_brick_right:
    func: release_brick_done
    params:
      object_name: blue_brick
      target_pos: [-0.4, -0.05, 0.83]
      target_dist_threshold: 0.34
      gripper_joint_pattern: "R_.*_proximal_joint"
      gripper_open_threshold: 0.15


# ─── TERMINATIONS (optional) ─────────────────────────────────
# Extra `DoneTerm` entries on `TerminationsCfg`. Each key becomes a cfg
# attribute name; `func` resolves to a function in the generated
# `mdp/terminations.py`. The generator emits a typed stub per unique
# function (the body returns `False` for every env until you fill it in).
#
# `time_out=True` marks a "ran out of time" termination; the conventional
# success signal used by the Mimic data-generation pipeline keeps the
# default `time_out=False`. The attribute name `time_out` is reserved by
# the built-in DoneTerm and cannot be reused here.
terminations:
  success:
    func: bricks_released_at_targets
    params:
      left_object_name: red_brick
      right_object_name: blue_brick
      left_target_pos: [-0.4, 0.05, 0.83]
      right_target_pos: [-0.4, -0.05, 0.83]
      target_dist_threshold: 0.29
      left_gripper_joint_pattern: "L_(index_proximal_joint|middle_proximal_joint|thumb_proximal_pitch_joint)"
      right_gripper_joint_pattern: "R_(index_proximal_joint|middle_proximal_joint|thumb_proximal_pitch_joint)"
      gripper_open_threshold: 0.15


# ─── MIMIC DATA GENERATION (optional) ────────────────────────
# When present, an additional `<task_id>-Mimic` gym env is registered
# alongside the base task. Its cfg class (`<ClassPrefix>MimicEnvCfg`)
# mixes the task cfg with `isaaclab.envs.mimic_env_cfg.MimicEnvCfg`,
# exposing `datagen_config` and `subtask_configs` for the Mimic pipeline.
#
# datagen:    Free-form passthrough — every key is forwarded as
#             `self.datagen_config.<key> = <value>` in the generated cfg.
#             See `DataGenConfig` in isaaclab/envs/mimic_env_cfg.py for the
#             full schema.
# subtasks:   Mapping of eef_name -> ordered list of SubTaskConfig entries.
#             Each entry is forwarded as kwargs to `SubTaskConfig(...)`.
#             Tuple-typed fields (e.g. `subtask_term_offset_range`) are
#             written as YAML lists and coerced to tuples by create_task.py.
mimic:
  datagen:
    name: demo_src_lego_g1_D0
    generation_guarantee: true
    generation_keep_failed: false
    generation_num_trials: 1000
    generation_select_src_per_subtask: false
    generation_select_src_per_arm: false
    generation_transform_first_robot_pose: false
    generation_interpolate_from_last_target_pose: true
    max_num_failures: 25
    seed: 1
  # Per-arm subtasks for grasp → move → release → idle. The
  # `subtask_term_signal` names must match attributes on the task's
  # `DatagenInfoCfg` observation group (see lego_g1/.../lego_g1_cfg.py).
  # The final subtask of each arm uses `null` per IsaacLab convention —
  # it represents "run until end of demo".
  subtasks:
    right:
      - object_ref: blue_brick
        subtask_term_signal: grasp_brick_right
        first_subtask_start_offset_range: [0, 0]
        subtask_term_offset_range: [0, 0]
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        action_noise: 0.003
        num_interpolation_steps: 0
        num_fixed_steps: 0
        apply_noise_during_interpolation: false
      - object_ref: blue_brick
        subtask_term_signal: move_brick_right
        subtask_term_offset_range: [0, 0]
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        action_noise: 0.003
        num_interpolation_steps: 3
        num_fixed_steps: 0
        apply_noise_during_interpolation: false
      - object_ref: blue_brick
        subtask_term_signal: release_brick_right
        subtask_term_offset_range: [0, 0]
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        action_noise: 0.003
        num_interpolation_steps: 0
        num_fixed_steps: 0
        apply_noise_during_interpolation: false
      - object_ref: blue_brick
        subtask_term_signal: null
        subtask_term_offset_range: [0, 0]
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        action_noise: 0.003
        num_interpolation_steps: 0
        num_fixed_steps: 0
        apply_noise_during_interpolation: false
    left:
      - object_ref: red_brick
        subtask_term_signal: grasp_brick_left
        first_subtask_start_offset_range: [0, 0]
        subtask_term_offset_range: [0, 0]
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        action_noise: 0.003
        num_interpolation_steps: 0
        num_fixed_steps: 0
        apply_noise_during_interpolation: false
      - object_ref: red_brick
        subtask_term_signal: move_brick_left
        subtask_term_offset_range: [0, 0]
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        action_noise: 0.003
        num_interpolation_steps: 3
        num_fixed_steps: 0
        apply_noise_during_interpolation: false
      - object_ref: red_brick
        subtask_term_signal: release_brick_left
        subtask_term_offset_range: [0, 0]
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        action_noise: 0.003
        num_interpolation_steps: 0
        num_fixed_steps: 0
        apply_noise_during_interpolation: false
      - object_ref: red_brick
        subtask_term_signal: null
        subtask_term_offset_range: [0, 0]
        selection_strategy: nearest_neighbor_object
        selection_strategy_kwargs:
          nn_k: 3
        action_noise: 0.003
        num_interpolation_steps: 0
        num_fixed_steps: 0
        apply_noise_during_interpolation: false
